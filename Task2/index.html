<!DOCTYPE html>
<html>
<head>
    <title>Three Divs</title>
    <style>
        div {
            border: 2px solid black;
            padding: 15px;
            margin: 20px;
            height: 100px;
            width: 300px;
        }

        .second {
            background-color: lightblue;
            color: blue;
        }

        #third {
            background-color: lightgreen;
            color: darkgreen;
            text-align: center;
        }
    </style>
</head>
<body>
    <h1>Three Divs</h1>

    <div>
        <h2>First Div</h2>
        <p>Cristiano Ronaldo is the goat.</p>
    </div>

    <div class="second">
        <h2>Second Div</h2>
        <p>Buddha Lama sir is the best.</p>
    </div>

    <div id="third">
        <h2>Third Div</h2>
        <p>JAY NEPAL</p>
    </div>
</body>
</html>
